<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f3f4f2" />
    <title>Gense</title>
    <script>
      // Before the first paint, so the page never flashes the other theme (src/lib/theme.ts keeps it in step).
      ;(function () {
        var pref = 'system'
        try {
          pref = JSON.parse(localStorage.getItem('gense.theme') || '"system"')
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        try {
          document.documentElement.dataset.accent = JSON.parse(localStorage.getItem('gense.accent') || '"jade"')
        } catch (e) {}
        document.querySelector('meta[name=theme-color]').content = dark ? '#0d0f10' : '#f3f4f2'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
